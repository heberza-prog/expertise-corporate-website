<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EXPERTISE SRL | Microsoft Cloud Partner</title>

<style>
:root{
  --ms:#0078D4;
  --green:#7FBA00;
  --dark:#0F172A;
  --gray:#6B7280;
  --light:#F5F7FA;
}

*{
  margin:0;
  padding:0;
  font-family:"Segoe UI", Arial;
}

body{background:white}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  padding:16px 60px;
  border-bottom:1px solid #eee;
}

.logo{color:var(--ms); font-weight:700}

nav a{
  margin:0 10px;
  text-decoration:none;
  color:#111;
}

/* ULTRA PRO HERO */
.hero{
  height:88vh;
  display:grid;
  grid-template-columns:1.1fr 1fr;
  align-items:center;
  padding:0 60px;

  /* MICROSOFT STYLE BACKGROUND */
  background:
    linear-gradient(90deg, rgba(0,120,212,0.92), rgba(0,120,212,0.65)),
    url('https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&w=1600&q=80');

  background-size:cover;
  background-position:center;
  color:white;
}

.hero-text h1{
  font-size:54px;
  font-weight:700;
  margin-bottom:16px;
  letter-spacing:-0.5px;
}

.hero-text p{
  font-size:18px;
  opacity:0.95;
  margin-bottom:24px;
  max-width:520px;
}

.btn{
  background:white;
  color:var(--ms);
  padding:12px 18px;
  border-radius:6px;
  text-decoration:none;
  font-weight:600;
}

/* RIGHT IMAGE (MICROSOFT STYLE PANEL) */
.hero-card{
  background:white;
  border-radius:16px;
  padding:12px;
  box-shadow:0 20px 40px rgba(0,0,0,0.25);
}

.hero-card img{
  width:100%;
  border-radius:12px;
}

/* RESPONSIVE */
@media(max-width:900px){
  .hero{
    grid-template-columns:1fr;
    text-align:center;
    height:auto;
    padding:80px 30px;
  }

  .hero-card{margin-top:30px}
}
</style>
</head>

<body>

<header>
<div class="logo">EXPERTISE SRL</div>
<nav>
<a href="#">Servicios</a>
<a href="#">Planes</a>
<a href="#">Contacto</a>
</nav>
</header>

<!-- ULTRA HERO -->
<section class="hero">

<div class="hero-text">
<h1>Modernizamos y aseguramos tu plataforma Microsoft</h1>

<p>
Azure | Microsoft 365 | Seguridad | Alta Disponibilidad | Continuidad Operativa
</p>

<a class="btn" href="#">Explorar servicios</a>
</div>

<div class="hero-card">
<img src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&fit=crop&w=1200&q=80">
</div>

</section>

</body>
</html>
